         Made for a themed exhibition based around the work of William
         Blake. I removed the spiritual aspect from perhaps Blake's most
         famous painting, *The Ancient of Days*, and all that was left
         was the dividers. If you lose the spiritual and mythical, what
         you are left with may be the truth, but it may also be grey and
         sterile.  (Dividers, model's own.)
