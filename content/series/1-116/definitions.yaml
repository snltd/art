- :number: 104
  :title: Go and Find Out the True Story Behind The Great Escape
  :image: 104.jpg
  :year: 2008
  :month: 3
  :day: 22
  :col: 4
  :row: 7
  :medium: oil, acrylic, sand, soil and collage  on masonite
  :x: 29
  :y: 29
  :desc: The Great Escape began in hut 104 of Stalag Luft III. The
      painting is made not only of earth colours, but also of sand and
      soil.  Buried in the muck are maps of the stalag, a picture of the
      monument to the men who died, and references to the utensils and
      materials the prisoners used to dig their tunnels; for instance
      1219 knives, 478 spoons, and 582 forks. The paint surface has been
      dug and scored with knives, spoons and forks. There are no
      references to the famous film, only to the less famous reality.

