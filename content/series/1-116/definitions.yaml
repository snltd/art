- :number: 10
  :title: Bases Covered
  :image: 010.jpg
  :year: 2008
  :month: 4
  :day: 19
  :col: 18
  :row: 2
  :medium: acrylic on masonite
  :x: 29
  :y: 29
  :desc: "Humans count in base ten, most probably because that's how many
      fingers we have. Computers tend to use base two, or base sixteen. The
      fingers are signing the letter 'A', which is ten in base
      sixteen, and the background is binary ten, where a white stripe
      represents a zero and orange a one."

