- :number: 35
  :title: "Cos I'm Sure as Hell No Rembrandt"
  :image: 035.jpg
  :year: 2008
  :month: 3
  :day: 28
  :col: 17
  :row: 4
  :medium: oil on masonite
  :x: 29
  :y: 29
  :desc: I was thirty-five years old when number thirty-five came up.
      This made me think of Rembrandt, and the self-portraits he painted
      throughout his life. I prepared myself a Rembrandt palette, right
      down to grinding charcoal into white paint to make blue, then I
      looked up "self portrait at thirty-five" and copied the
      background. The lines are "self portrait" in barcode. Some lines
      are thin and carefully painted, like Rebrandt's early work, others
      are heavy impasto, the way he painted later in his life.

