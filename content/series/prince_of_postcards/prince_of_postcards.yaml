         This, along with [a companion
         piece](/piece/imperfect_reproduction/precious_little_ambiguity) was
         painted for an exhibition themed around postcards. All
         submissions had to be six by four inches, the size of a
         postcard.

         In a beautiful irony, the painting was lost in the post on its
         way to the exhibition. The companion survived because it wasn't
         dry in time, so never got sent.
