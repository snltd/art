         The picture doesn't do this painting justice. It has a great
         depth of colour, and incorporates a lot of metallic paint,
         which gives it a manufactured, industrial look. In common with
         all the other *Prince of Postcard* paintings, it is highly
         glazed, with the kind of finish you might expect to see on
         ceramics.
