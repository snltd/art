         As a record collector, people have been telling me for twenty
         years that vinyl's coming back. It's not. It's never really
         been away, but it's not much stronger now than it ever was.

         The image was made by printing a photograph of part of my
         record collection through a broken laser printer with empty
         toner cartridges. No digital processing was done.

         Signed/numbered edition of five.
