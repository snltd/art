:desc:   |
         I cropped a random part out of a photograph of two young women
         using a 1960s minicomputer and printed it through a printer
         almost out of toner. I transcribed the resulting streaky,
         messed-up image into a painting, as faithfully as possible,
         then scraped the the paint off with a knife, leaving only the
         pigment which had penetrated the canvas. Hints of red, green,
         and blue have been added to refer back to the picture's digital
         origins.
