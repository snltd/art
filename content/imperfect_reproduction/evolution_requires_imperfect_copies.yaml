         When I was at school, my friend made me a tape of *[The Queen
         is
         Dead](http://www.discogs.com/Smiths-The-Queen-Is-Dead/master/20137)*.
         It was an *n*<sup>th</sup> generation copy, and at some point
         in the tape-to-tape chain, someone had set the record level too
         high, with the result that the music was clipped and distorted.
         Later, when I bought a copy of the record, I didn't like it,
         because although it sounded better in every measurable sense,
         it didn't sound "right".

         Recently I was reading about Darwinism, and the phrase
         "evolution requires imperfect copies" stuck in my head. I think
         this also applies to art, as the imperfections and differences
         in the way an artist sees and reproduces the world are what
         make paintings interesting.

         This picture was an attempt to copy the same source image
         sixteen times.  Each is different from, but also the same as,
         all the others.  None are perfect, or anything close to it.
