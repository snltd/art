         This follows on from [earlier work painting record sleeves on
         beermats](/series/ill_tell_you_whats_a_great_album).  Whereas
         that piece looked at albums, this is made up of oil paintings
         of ten seven-inch single sleeves, again with all text removed.

         Once painted, the beermats were cut up into nine parts, and
         reassembled. Numbers were given to each fragment, and each
         fragment's position in the final piece was dictated by a
         mathematical sequence.

         The singles were chosen partly because their sleeves represent
         different original image types (painting, landscape and
         portrait photography, sculpture, graphics, screenprint) and
         partly because they had all featured on mixtapes I had made for
         my girlfriend, who is now my wife.  For that reason, I am not
         allowed to sell this.
