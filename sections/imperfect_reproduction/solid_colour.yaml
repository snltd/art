:desc:   A malfunctioning printer was used to print blocks of solid
         colour. The resulting images were scanned, and made into this
         composite by a computer program. An organic, unique image was
         made from what should have been a repeatable, deterministic set
         of steps.  Signed/numbered edition of five.
