         Even now, under the crushing dominance of smartphones,
         computing is seen as a "male" pursuit. Certainly, the IT
         workforce is overwhelmingly male, and is shot through with
         casual sexism. Yet back when computers were rare, exotic,
         complex beasts, the people who operated them were generally
         women. I'm not sure how the shift occurred, but it has, and
         equality will be hard to restore so long as we perpetuate the
         idea that boys can code, whilst girls can have dress-up apps on
         phones.

         Oh, and knowing how to launch things on an iPad does not equate
         to "knowing about computers".

         The original image of early computer operators was printed many
         times on a failing printer, and the most pleasing one selected.
         No digital processing was used.

         Signed/numbered edition of five.
