         Made for a themed exhibition about "temptation". This is
         painted in high-gloss enamel, and you can see yourself in it,
         with a devlish red glow.

         Aside from the obvious, it's about what makes something art,
         particularly the act of removing some piece of an existing
         whole to make a new work of art. If you use the paint and brush
         sitting on top (the ones I used to make the picture) to finish
         it off, then it's just a red square. The unfinished part makes
         it what it is.
