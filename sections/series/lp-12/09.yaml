  This painting was built like a collection: randomly growing; every square
  sized, designed and painted in isolation, with no plan towards a harmonic
  whole.

  The run out says *oh, you have loads of songs*, and the visual cue is from
  the decorative arts. It's a rehash of
  an old painting, but replaces the original's colourful chaos with a more
  arch, "curated" feel.  Every square is supposed to be unique, but good
  collections always have the odd duplicate.

