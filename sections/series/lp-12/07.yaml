  Many of the components of *More Than Seven Variables* are related. For
  instance, 'A' and 'b', or the four Kanji which represent the colours of
  cartridge wires.

  Connecting related points produced a pattern of triangles, which became an
  abstract landscape.  *No Meaning but Your Own
  Meaning* is a remix. And it's geometry.

  *Come disconnect the dots with me*.

