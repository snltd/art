:sleevenotes: |
  A collection of constants, formulae and references relating to the
  mathematics, science, and taxonomy of records. The placing of everything is
  important. The diameter symbol is central, and exactly the size it
  says: the size of the hole in a record.  Relative to that point, infinity
  is where the never-ending run-out groove should be; 10" is on a
  five-inch radius and so-on. "Loud" and "quiet" are where loud and quiet tracks
  should be on a correctly sequenced LP, as dynamic range decreases on the
  inner bands.  "1/2 3/4" could be the sides of a double LP, or given
  its location, a count-in.

  *Working on my work, which no one understands*.
