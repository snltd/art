:sleevenotes: |
  The title and the run-out text (*one of the best songs I've ever heard*) of
  *Thriller* contradicts the painting's style and literal message.  One  man's
  thriller is another man's filler.

  Records are an equal-opportunity medium, making you
  listen to every song every time. A person gets out of art what they put in,
  and eventually you might come to love something you first thought was
  difficult, or dull. This is ultimately a more rewarding experience than
  hitting skip until your favourite comes on.

  Like a record, the image was made by printing an inverse.

