  A second painting of a record-player bookends the collection
  The needle sits in the run-out groove; a life-support machine
  keeping the clicking heartbeat going until someone pulls the plug. What
  comes next?

  This picture already existed, as a painting and a photograph. It
  is a pointless reissue of something no one much cared about before. Like
  so many records in 2025.
