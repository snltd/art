:sleevenotes: |
  A record collection is a personal story. Before the internet reduced it to
  a simple case of having the money or not, record collecting involved luck,
  persistence, shoe-leather, and knowledge. This painting tries to capture that,
  and some of the memories bound to those shelves of card and plastic. 
